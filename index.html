<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluency</title>
<meta name="description" content="Fluency">
<meta name="theme-color" content="#424242">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluency">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#fbfbfb; --ink:#424242; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }

  /* Splash: shown for 9 seconds, then fades out */
  #splash { position:fixed; inset:0; z-index:9999; display:grid; place-items:center;
    background:var(--bg); transition:opacity .6s ease, visibility .6s; }
  #splash.hide { opacity:0; visibility:hidden; }
  #splash img { max-width:100%; max-height:100%; object-fit:contain;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  #app { min-height:100%; padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    display:grid; place-items:center; }
  #app h1 { font-weight:600; letter-spacing:-.02em; }
</style>
</head>
<body>

<div id="splash" aria-label="Fluency is loading" role="img">
  <picture>
    <!-- wide screens: animated GIF; phones/portrait: WebP -->
    <source media="(min-width:768px) and (orientation:landscape)"
            srcset="https://raw.githubusercontent.com/sureshapps/fluency/refs/heads/main/splash/app_splashscreen.gif">
    <img src="https://raw.githubusercontent.com/sureshapps/fluency/refs/heads/main/splash/splash7.webp"
         alt="Fluency" decoding="async" fetchpriority="high">
  </picture>
</div>

<main id="app">
  <!-- your app goes here -->
  <h1>Fluency</h1>
</main>

<script>
  const SPLASH_MS = 9000;
  const splash = document.getElementById('splash');
  setTimeout(() => {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 700);
  }, SPLASH_MS);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('sw.js').catch(console.error));
  }
</script>
</body>
</html>
